sonar.organization=lsj-tech
sonar.projectKey=LSJ-tech_Condofy

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# Migraciones y comandos de management son generados/casi nunca se corren
# bajo test -- sin esto, su coverage en 0% distorsiona el número total sin
# aportar información real sobre qué código de la app está probado.
sonar.coverage.exclusions=**/migrations/**,**/management/commands/**,manage.py,config/wsgi.py,config/asgi.py
