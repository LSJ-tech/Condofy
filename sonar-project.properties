sonar.organization=lsj-tech
sonar.projectKey=LSJ-tech_Condofy

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# Los tests viven junto al código que prueban (tests.py/test_*.py dentro de
# cada app), no en una carpeta aparte -- sin esto Sonar los trata como
# código de producción más. Como .coveragerc los omite a propósito de la
# medición (no tiene sentido medir "coverage de los tests"), Sonar los veía
# como líneas nuevas con 0% de cobertura y hundía new_coverage (bajó de
# 50.9% a 44.1% justo al agregar ~750 líneas de tests nuevos). Esto los
# reclasifica como tests, no como fuente a cubrir.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/test_*.py,**/*_test.py

# Migraciones y comandos de management son generados/casi nunca se corren
# bajo test -- sin esto, su coverage en 0% distorsiona el número total sin
# aportar información real sobre qué código de la app está probado.
sonar.coverage.exclusions=**/migrations/**,**/management/commands/**,manage.py,config/wsgi.py,config/asgi.py
