{% extends "core/base.html" %}
{% block titulo %}Nueva unidad{% endblock %}
{% block contenido %}
<h1 class="h4 mb-3">Nueva unidad</h1>
<form method="post" class="col-md-5">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Guardar</button>
</form>
{% endblock %}
