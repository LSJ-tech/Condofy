{% extends "core/base.html" %}
{% block titulo %}Suscripción vencida{% endblock %}
{% block contenido %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-circle display-1 text-warning"></i>
    <h1 class="h4 mt-3">Tu suscripción a {{ PLATFORM_NAME }} está vencida</h1>
    <p class="text-muted">Renueva el pago para seguir usando el botón de pánico, avisos, accesos y gastos comunes.</p>
    <form method="post" action="{% url 'pago-iniciar' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Pagar con Mercado Pago</button>
    </form>
</div>
{% endblock %}
