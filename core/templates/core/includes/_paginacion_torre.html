{% if page_obj.has_other_pages %}
<nav>
    <ul class="pagination">
        {% if page_obj.has_previous %}
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if torre_seleccionada %}&torre={{ torre_seleccionada }}{% endif %}">Anterior</a></li>
        {% endif %}
        <li class="page-item disabled"><span class="page-link">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span></li>
        {% if page_obj.has_next %}
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if torre_seleccionada %}&torre={{ torre_seleccionada }}{% endif %}">Siguiente</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
