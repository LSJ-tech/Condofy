services:
  - type: web
    name: condofy
    env: python
    plan: free  # Pasar a un plan pago cuando el servicio esté listo para producción real.
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: condofy.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://condofy.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: condofy-db
          property: connectionString
      # Configurar antes de aceptar clientes reales (ver README):
      # EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD, DEFAULT_FROM_EMAIL
      # MERCADOPAGO_ACCESS_TOKEN (sin ella no aparece el botón de pago en línea)

databases:
  - name: condofy-db
    plan: free
