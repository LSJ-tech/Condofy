services:
  - type: web
    name: barrioseguro
    env: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: barrioseguro.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://barrioseguro.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: barrioseguro-db
          property: connectionString
      # Configurar antes de aceptar clientes reales (ver README):
      # EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD, DEFAULT_FROM_EMAIL
      # MERCADOPAGO_ACCESS_TOKEN (sin ella no aparece el botón de pago en línea)

databases:
  - name: barrioseguro-db
    plan: free
