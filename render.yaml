services:
  - type: web
    name: condofy
    env: python
    plan: free  # Pasar a un plan pago cuando el servicio esté listo para producción real.
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: condofy-k4ah.onrender.com,condofy.devquad.cl
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://condofy-k4ah.onrender.com,https://condofy.devquad.cl
      - key: DATABASE_URL
        fromDatabase:
          name: condofy-db
          property: connectionString
      # Configurar antes de aceptar clientes reales (ver README):
      # RESEND_API_KEY, DEFAULT_FROM_EMAIL (sin RESEND_API_KEY los correos solo se imprimen en logs)
      # MERCADOPAGO_ACCESS_TOKEN (sin ella no aparece el botón de pago en línea)

databases:
  - name: condofy-db
    plan: free
